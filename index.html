<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berita SP PLN Kalbar</title>
    <script>
      // Automatically correct missing trailing slashes on GitHub Pages 
      // preventing asset 404s and keeping relative path imports pristine.
      if (window.location.hostname.indexOf('github.io') !== -1) {
        var path = window.location.pathname;
        if (path && path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.href + '/');
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
