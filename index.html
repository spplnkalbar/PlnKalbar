<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berita SP PLN Kalbar</title>
    <script>
      // Prevent benign sandbox "Script error." notifications from interrupting the preview experience.
      window.addEventListener('error', function(e) {
        if (!e.message || e.message === 'Script error.' || e.message === 'Script error' || (typeof e.message === 'string' && e.message.includes('Script error'))) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      
      window.onerror = function(message, url, line, col, error) {
        if (!message || message === 'Script error.' || message === 'Script error' || (typeof message === 'string' && message.includes('Script error'))) {
          return true; // prevents firing default handler
        }
        return false;
      };

      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('Script error')) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin="anonymous" src="/src/main.tsx"></script>
  </body>
</html>
